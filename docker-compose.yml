version: "3.8"

services:
  traefik:
    image: traefik:v2.9
    command:
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.leresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.leresolver.acme.email=you@ame-tama.com"
      - "--certificatesresolvers.leresolver.acme.storage=/letsencrypt/acme.json"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt:/letsencrypt"

  nextjs:
    build: .
    labels:
      - "traefik.enable=true"
      # Route traffic for your domain...
      - "traefik.http.routers.nextjs.rule=Host(`ame-tama.com`)"
      - "traefik.http.routers.nextjs.entrypoints=websecure"
      - "traefik.http.routers.nextjs.tls.certresolver=leresolver"
      # Optional: redirect HTTP → HTTPS
      - "traefik.http.routers.nextjs-secure.rule=Host(`ame-tama.com`)"
      - "traefik.http.routers.nextjs-secure.entrypoints=web"
      - "traefik.http.routers.nextjs-secure.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    depends_on:
      - traefik

volumes:
  letsencrypt:
